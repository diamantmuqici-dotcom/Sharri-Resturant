<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1110">
<title>Sharri — Porosi</title>
<style>
:root{--bg:#0b100e;--p:#141b18;--p2:#1b2420;--line:#2b3631;--text:#f5f7f5;--muted:#9ba8a1;--gold:#d7a23a;--ok:#4caf7d;--red:#df6262;--shadow:0 18px 60px #0008}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1c2923,#0b100e 45%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#0c1110ee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{font-size:20px;font-weight:900;letter-spacing:-.04em}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}.topRight{display:flex;gap:8px;align-items:center}.main{max-width:1500px;margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:22px}.hero h1{font-size:clamp(28px,4vw,44px);margin:0;letter-spacing:-.05em}.hero p{color:var(--muted);margin:7px 0 0}.btn{border:1px solid var(--line);background:var(--p2);color:var(--text);padding:11px 15px;border-radius:12px;font-weight:800}.btn.primary{background:var(--gold);color:#171106;border-color:transparent}.btn.ok{background:var(--ok);color:#07140e;border-color:transparent}.btn.red{background:var(--red);color:white;border-color:transparent}.btn.big{padding:15px 19px;font-size:16px}.pill{border:1px solid var(--line);background:var(--p);padding:9px 12px;border-radius:999px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}.card{background:#141b18e8;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.order{padding:17px;cursor:pointer}.order:hover{border-color:#506057}.tag{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#d7dfda;background:#202a26;padding:5px 8px;border-radius:7px}.order h3{margin:12px 0 3px;font-size:20px}.money{font-size:26px;font-weight:900}.muted{color:var(--muted)}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.section{margin-top:25px}.section h2{font-size:17px}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginBox{width:min(420px,100%);padding:28px}.loginBox h1{font-size:36px;margin:0}.loginBox p{color:var(--muted)}label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}input,select{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#0d1311;color:white;outline:0}input:focus,select:focus{border-color:var(--gold)}.error{color:#ff9c9c;font-size:13px;margin-top:10px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{padding:20px;text-align:left;border:1px solid var(--line);border-radius:15px;background:var(--p2);color:white}.choice strong{display:block;font-size:18px}.choice small{display:block;color:var(--muted);margin-top:5px}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.menu{display:grid;grid-template-columns:1.45fr .85fr;gap:18px;align-items:start}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:7px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px}.product{min-height:105px;padding:14px;text-align:left;border:1px solid var(--line);background:var(--p);color:white;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between}.product strong{line-height:1.2}.product span{color:var(--gold);font-weight:900}.summary{padding:18px;position:sticky;top:88px}.line{padding:10px 0;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:30px;height:30px;border-radius:8px;border:0;background:#29342f;color:white}.total{font-size:30px;font-weight:900;padding:15px 0;border-top:1px solid var(--line);margin-top:10px}.modalBack{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#111815;border:1px solid var(--line);border-radius:20px;padding:22px}.admin{display:grid;grid-template-columns:220px 1fr;gap:18px}.side{padding:10px;height:max-content;position:sticky;top:88px}.side button{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:12px;border-radius:10px}.side button.active,.side button:hover{background:var(--p2);color:white}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.table th{color:var(--muted)}.stat{padding:18px}.stat b{font-size:28px;display:block}.toast{position:fixed;right:18px;bottom:18px;background:#eff8f2;color:#111;padding:13px 16px;border-radius:12px;font-weight:800;z-index:100;box-shadow:var(--shadow)}@media(max-width:900px){.menu,.admin{grid-template-columns:1fr}.summary,.side{position:static}.hero{align-items:stretch;flex-direction:column}}@media(max-width:560px){.numbers{grid-template-columns:repeat(4,1fr)}.choices{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}.top{padding:12px 14px}.pill{display:none}.main{padding:15px}}
</style>
</head>
<body><div id="app"></div>
<script>
var S={u:null,menu:null,active:[],tables:null,type:null,table:null,name:'',draft:[],cat:null,order:null,adminTab:'panel'};
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function eur(c){return (Number(c)/100).toFixed(2)+'€'}
async function api(u,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});var r=await fetch(u,o),d=await r.json().catch(function(){return{}});if(!r.ok)throw Error(d.error||'Ndodhi një gabim.');return d}
function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove()},2600)}
function head(sub){return '<header class="top"><div class="brand">SHARRI<small>'+esc(sub||'Sistemi i porosive')+'</small></div><div class="topRight"><span class="pill">'+esc(S.u.name)+' · '+(S.u.role==='ADMIN'?'Administrator':'Kamarier')+'</span><button class="btn" onclick="logout()">Dil</button></div></header>'}
function set(x){document.getElementById('app').innerHTML=x}
async function start(){var s=await api('/api/sesioni');if(!s.loggedIn)return login();S.u=s.user;if(S.u.role==='ADMIN')return admin();return waiter()}
function login(){set('<div class="login"><div class="card loginBox"><h1>SHARRI</h1><p>Kyçu në sistemin e porosive.</p><form onsubmit="doLogin(event)"><label>Përdoruesi</label><input id="user" required><label>Fjalëkalimi</label><input id="pass" type="password" required><button class="btn primary big" style="width:100%;margin-top:18px">Kyçu</button><div id="err"></div></form></div></div>')}
async function doLogin(e){e.preventDefault();try{var d=await api('/api/kycu',{method:'POST',body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});S.u=d.user;S.u.role==='ADMIN'?admin():waiter()}catch(x){document.getElementById('err').innerHTML='<div class="error">'+esc(x.message)+'</div>'}}
async function logout(){await api('/api/dil',{method:'POST'});location.reload()}
async function waiter(){S.menu=await api('/api/menu');S.active=await api('/api/aktive');S.tables=await api('/api/tavolinat');renderWaiter()}
function renderWaiter(){var t=S.active.filter(x=>x.table_number),n=S.active.filter(x=>x.order_type==='EMER'),z=S.active.filter(x=>x.order_type==='ME_VETI'||x.order_type==='PER_KETU');set(head('Kamarier')+'<main class="main"><div class="hero"><div><h1>Porositë</h1><p><b>'+S.tables.occupied+' / 50</b> tavolina të zëna · '+S.active.length+' porosi aktive</p></div><button class="btn primary big" onclick="newOrder()">POROSI E RE</button></div>'+section('Tavolina të zëna',t,'TAVOLINË')+section('Porosi me emër',n,'EMËR')+section('Porosi pa tavolinë',z,'PA TAVOLINË')+'</main>')}
function section(title,a,label){var h='<div class="section"><h2>'+title+'</h2>';if(!a.length)return h+'<div class="empty">Nuk ka porosi aktive.</div></div>';return h+'<div class="grid">'+a.map(function(o){var where=o.table_number?'Tavolina '+o.table_number:(o.custom_identifier|| (o.order_type==='ME_VETI'?'Me veti':'Për këtu'));return '<article class="card order" onclick="openOrder('+o.id+')"><span class="tag">'+label+'</span><h3>'+esc(where)+'</h3><div class="money">'+eur(o.total_cents)+'</div><p class="muted">'+o.item_count+' produkte · '+new Date(o.opened_at).toLocaleTimeString('sq-AL',{hour:'2-digit',minute:'2-digit'})+'</p></article>'}).join('')+'</div></div>'}
function newOrder(){set(head('Porosi e re')+'<main class="main"><div class="hero"><div><h1>Porosi e re</h1><p>Zgjidhni ku i përket porosia.</p></div><button class="btn" onclick="waiter()">Kthehu</button></div><div class="choices"><button class="choice" onclick="choose(\'TAVOLINE\')"><strong>Tavolinë</strong><small>Numri nga 1 deri në 50.</small></button><button class="choice" onclick="choose(\'EMER\')"><strong>Me emër</strong><small>Kur e dini emrin ose identifikuesin.</small></button><button class="choice" onclick="choose(\'ME_VETI\')"><strong>Me veti</strong><small>Vetëm kur porosia ka ushqim.</small></button><button class="choice" onclick="choose(\'PER_KETU\')"><strong>Për këtu</strong><small>Vetëm për porosi ushqimi.</small></button></div></main>')}
function choose(t){S.type=t;if(t==='TAVOLINE'){var a='';for(var i=1;i<=50;i++)a+='<button class="btn big" onclick="draftStart('+i+')">Tavolina '+i+'</button>';set(head('Zgjedhja e tavolinës')+'<main class="main"><div class="hero"><div><h1>Tavolinë</h1><p>Zgjidhni numrin.</p></div><button class="btn" onclick="newOrder()">Kthehu</button></div><div class="numbers">'+a+'</div></main>')}else if(t==='EMER'){set(head('Porosi me emër')+'<main class="main"><div class="card" style="padding:22px;max-width:600px"><h2>Emri / identifikuesi</h2><p class="muted">P.sh. Bastria, Enver, Nfund te Ora.</p><input id="cname" autofocus><div class="row" style="margin-top:15px"><button class="btn" onclick="newOrder()">Kthehu</button><button class="btn primary" onclick="namedStart()">Vazhdo</button></div></div></main>')}else draftStart(null)}
function namedStart(){var n=document.getElementById('cname').value.trim();if(!n)return toast('Shkruani emrin ose identifikuesin.');S.name=n;draftStart(null)}
function draftStart(t){S.table=t;S.name=S.type==='EMER'?S.name:'';S.draft=[];renderDraft()}
function renderDraft(){if(S.cat==null)S.cat=S.menu.categories[0].id;var ps=S.menu.products.filter(function(p){return p.category_id===S.cat}),sum=S.draft.reduce(function(a,x){return a+x.product.price_cents*x.qty},0);var cats=S.menu.categories.map(function(c){return '<button class="btn '+(c.id===S.cat?'primary':'')+'" onclick="S.cat='+c.id+';renderDraft()">'+esc(c.name)+'</button>'}).join('');var lines=S.draft.length?S.draft.map(function(x,i){return '<div class="line"><div class="row"><b>'+esc(x.product.name)+'</b><b>'+eur(x.product.price_cents*x.qty)+'</b></div><div class="row"><div class="qty"><button aria-label="Zvogëlo sasinë" onclick="draftQty('+i+',-1)">−</button><b>'+x.qty+'</b><button aria-label="Rrit sasinë" onclick="draftQty('+i+',1)">+</button></div><span class="muted">'+eur(x.product.price_cents)+'</span></div></div>'}).join(''):'<div class="empty">Shtoni produktet.</div>';set(head('Porosi')+'<main class="main"><div class="hero"><div><h1>'+esc(S.type==='TAVOLINE'?'Tavolina '+S.table:S.type==='EMER'?S.name:S.type==='ME_VETI'?'Me veti':'Për këtu')+'</h1><p>Shtoni produktet duke i prekur.</p></div><button class="btn" onclick="newOrder()">Anulo</button></div><div class="menu"><section><div class="cats">'+cats+'</div><div class="products">'+ps.map(function(p){return '<button class="product" onclick="addDraft('+p.id+')"><strong>'+esc(p.name)+'</strong><span>'+eur(p.price_cents)+'</span></button>'}).join('')+'</div></section><aside class="card summary"><h2>Porosia</h2>'+lines+'<div class="total">'+eur(sum)+'</div><button class="btn primary big" style="width:100%" onclick="saveDraft()">Ruaj porosinë</button></aside></div></main>')}
function addDraft(id){var p=S.menu.products.find(function(x){return x.id===id}),x=S.draft.find(function(x){return x.product.id===id});x?x.qty++:S.draft.push({product:p,qty:1});renderDraft()}
function draftQty(i,d){S.draft[i].qty+=d;if(S.draft[i].qty<1)S.draft.splice(i,1);renderDraft()}
async function saveDraft(){if(!S.draft.length)return toast('Shtoni të paktën një produkt.');var food=S.draft.some(function(x){return x.product.kind==='USHQIM'||x.product.kind==='EMBELSIRE'});if((S.type==='ME_VETI'||S.type==='PER_KETU')&&!food)return toast('Me veti dhe Për këtu lejohen vetëm kur porosia ka ushqim.');try{var d=await api('/api/porosi',{method:'POST',body:JSON.stringify({orderType:S.type,tableNumber:S.table,customIdentifier:S.name,items:S.draft.map(function(x){return{productId:x.product.id,quantity:x.qty}})})});toast('Porosia u ruajt.');openOrder(d.id)}catch(e){toast(e.message)}}
async function openOrder(id){S.order=await api('/api/porosi/'+id);renderOrder()}
function renderOrder(){var o=S.order;if(S.cat==null&&S.menu&&S.menu.categories.length)S.cat=S.menu.categories[0].id;var cats=S.menu.categories.map(function(c){return '<button class="btn '+(c.id===S.cat?'primary':'')+'" onclick="S.cat='+c.id+';orderMenu()">'+esc(c.name)+'</button>'}).join(''),lines=o.items.map(function(x){return '<div class="line"><div class="row"><b>'+esc(x.product_name_snapshot)+'</b><b>'+eur(x.unit_price_cents*x.quantity)+'</b></div><div class="row"><div class="qty"><button aria-label="Zvogëlo sasinë" onclick="changeItem('+o.id+','+x.id+','+(x.quantity-1)+')">−</button><b>'+x.quantity+'</b><button aria-label="Rrit sasinë" onclick="changeItem('+o.id+','+x.id+','+(x.quantity+1)+')">+</button></div><span class="muted">'+eur(x.unit_price_cents)+'</span></div></div>'}).join('');var where=o.table_number?'Tavolina '+o.table_number:(o.custom_identifier|| (o.order_type==='ME_VETI'?'Me veti':'Për këtu'));set(head('Porosi aktive')+'<main class="main"><div class="hero"><div><h1>'+esc(where)+'</h1><p>Porosia #'+o.order_number+' · '+dt(o.opened_at)+'</p></div><button class="btn" onclick="waiter()">Kthehu</button></div><div class="menu"><section><div class="cats">'+cats+'</div><div id="orderProducts"></div></section><aside class="card summary"><h2>Porosia #'+o.order_number+'</h2>'+lines+'<div class="total">'+eur(o.total_cents)+'</div><button class="btn ok big" style="width:100%" onclick="pay('+o.id+')">PAGESA</button></aside></div></main>');orderMenu()}
function orderMenu(){var ps=S.menu.products.filter(function(p){return p.category_id===S.cat}),el=document.getElementById('orderProducts');if(!el)return;el.innerHTML='<div class="products">'+ps.map(function(p){return '<button class="product" onclick="addOrder('+S.order.id+','+p.id+')"><strong>'+esc(p.name)+'</strong><span>'+eur(p.price_cents)+'</span></button>'}).join('')+'</div>'}
async function addOrder(id,p){try{await api('/api/porosi/'+id+'/shto',{method:'POST',body:JSON.stringify({productId:p})});openOrder(id)}catch(e){toast(e.message)}}
async function changeItem(id,item,q){try{await api('/api/porosi/'+id+'/sasia',{method:'PATCH',body:JSON.stringify({itemId:item,quantity:q})});openOrder(id)}catch(e){toast(e.message)}}
function pay(id){document.body.insertAdjacentHTML('beforeend','<div class="modalBack" id="pay"><div class="modal"><h2>Përfundo pagesën</h2><p class="muted">Totali</p><div class="total">'+eur(S.order.total_cents)+'</div><div class="choices"><button class="choice" onclick="finish('+id+',\'CASH\')"><strong>Para të gatshme</strong></button><button class="choice" onclick="finish('+id+',\'CARD\')"><strong>Kartelë</strong></button><button class="choice" onclick="finish('+id+',\'OTHER\')"><strong>Tjetër</strong></button></div><button class="btn" style="margin-top:15px" onclick="document.getElementById(\'pay\').remove()">Kthehu</button></div></div>')}
async function finish(id,m){try{await api('/api/porosi/'+id+'/pagesa',{method:'POST',body:JSON.stringify({method:m})});document.getElementById('pay').remove();toast('Pagesa u përfundua.');waiter()}catch(e){toast(e.message)}}
async function admin(){var s=await api('/api/statistika');renderAdmin(s)}
function renderAdmin(s){set(head('Administratë')+'<main class="main"><div class="hero"><div><h1>Administrata</h1><p>Porosi, pagesa dhe gjurmë të sistemit.</p></div></div><div class="admin"><aside class="card side"><button class="'+(S.adminTab==='panel'?'active':'')+'" onclick="S.adminTab=\'panel\';admin()">Paneli</button><button class="'+(S.adminTab==='historiku'?'active':'')+'" onclick="S.adminTab=\'historiku\';adminTab()">Historiku</button><button class="'+(S.adminTab==='gjurmet'?'active':'')+'" onclick="S.adminTab=\'gjurmet\';adminTab()">Gjurmët</button></aside><section id="adminContent"></section></div></main>');adminTab(s)}
async function adminTab(s){var el=document.getElementById('adminContent');if(S.adminTab==='panel'){s=s||await api('/api/statistika');el.innerHTML='<div class="grid"><div class="card stat"><b>'+s.revenue+'</b><span class="muted">Të hyra sot</span></div><div class="card stat"><b>'+s.paid+'</b><span class="muted">Porosi të paguara</span></div><div class="card stat"><b>'+s.total+'</b><span class="muted">Porosi sot</span></div><div class="card stat"><b>'+s.cancelled+'</b><span class="muted">Të anuluara</span></div></div><div class="section card" style="padding:18px"><h2>Produktet më të shitura</h2><div class="tableWrap"><table class="table"><tr><th>Produkt</th><th>Sasia</th></tr>'+s.top.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+x.quantity+'</td></tr>'}).join('')+'</table></div></div>';return}if(S.adminTab==='historiku'){var rows=await api('/api/historiku');el.innerHTML='<div class="card" style="padding:18px"><div class="row"><div><h2>Historiku</h2><p class="muted">Vetëm porositë e përfunduara ose të anuluara.</p></div><input id="search" style="max-width:320px" placeholder="Kërko tavolinë, emër, porosi..." oninput="searchHistory()"></div><div id="hist" class="tableWrap" style="margin-top:14px">'+hist(rows)+'</div></div>';return}var a=await api('/api/audit');el.innerHTML='<div class="card" style="padding:18px"><h2>Gjurmët e sistemit</h2><div class="tableWrap"><table class="table"><tr><th>Ora</th><th>Përdoruesi</th><th>Veprimi</th><th>Objekti</th></tr>'+a.map(function(x){return '<tr><td>'+dt(x.created_at)+'</td><td>'+esc(x.actor_name||'Sistem')+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity_type||'')+' '+(x.entity_id||'')+'</td></tr>'}).join('')+'</table></div></div>'}
function hist(a){return a.length?'<table class="table"><tr><th>Porosia</th><th>Koha</th><th>Vendndodhja</th><th>Kamarieri</th><th>Totali</th><th>Statusi</th></tr>'+a.map(function(x){var w=x.table_number?'Tavolina '+x.table_number:(x.custom_identifier|| (x.order_type==='ME_VETI'?'Me veti':'Për këtu'));return '<tr onclick="details('+x.id+')" style="cursor:pointer"><td>#'+x.order_number+'</td><td>'+new Date(x.completed_at||x.updated_at).toLocaleString('sq-AL')+'</td><td>'+esc(w)+'</td><td>'+esc(x.waiter_name)+'</td><td>'+eur(x.total_cents)+'</td><td>'+(x.status==='PAID'?'Paguar':'Anuluar')+'</td></tr>'}).join('')+'</table>':'<div class="empty">Nuk u gjet asnjë porosi.</div>'}
async function searchHistory(){var q=document.getElementById('search').value,a=await api('/api/historiku?'+new URLSearchParams({q:q}));document.getElementById('hist').innerHTML=hist(a)}
async function details(id){var o=await api('/api/historiku/'+id),w=o.table_number?'Tavolina '+o.table_number:(o.custom_identifier|| (o.order_type==='ME_VETI'?'Me veti':'Për këtu'));document.body.insertAdjacentHTML('beforeend','<div class="modalBack" id="detail"><div class="modal"><div class="row"><div><h2>Porosia #'+o.order_number+'</h2><p class="muted">'+esc(w)+' · '+esc(o.waiter_name)+'</p></div><button class="btn" onclick="document.getElementById(\'detail\').remove()">Mbyll</button></div><div class="summary-list">'+o.items.map(function(x){return '<div class="line row"><span>'+x.quantity+' × '+esc(x.product_name_snapshot)+'</span><b>'+eur(x.quantity*x.unit_price_cents)+'</b></div>'}).join('')+'</div><div class="total">'+eur(o.total_cents)+'</div><h3>Ngjarjet</h3>'+o.events.map(function(e){return '<p class="muted">'+dt(e.created_at)+' · '+esc(e.event_type)+'</p>'}).join('')+'</div></div>')}

function dt(x){var s=String(x||'');if(!s)return '-';if(!/[zZ]|[+-]\d\d:\d\d$/.test(s))s=s.replace(' ','T')+'Z';return new Date(s).toLocaleString('sq-AL',{timeZone:'Europe/Belgrade',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});}function tm(x){var s=String(x||'');if(!/[zZ]|[+-]\d\d:\d\d$/.test(s))s=s.replace(' ','T')+'Z';return new Date(s).toLocaleTimeString('sq-AL',{timeZone:'Europe/Belgrade',hour:'2-digit',minute:'2-digit'});}
S.historyFilter=S.historyFilter||'ALL';S.historyRows=S.historyRows||[];
function pay(id){document.body.insertAdjacentHTML('beforeend','<div class="modalBack" id="pay"><div class="modal"><h2>Përfundo pagesën</h2><p class="muted">Totali</p><div class="total">'+eur(S.order.total_cents)+'</div><div class="choices"><button class="choice" onclick="finish('+id+',\'CASH\')"><strong>Para të gatshme</strong></button><button class="choice" onclick="finish('+id+',\'CARD\')"><strong>Kartelë</strong></button><button class="choice" onclick="finish('+id+',\'OTHER\')"><strong>Tjetër</strong></button></div><button class="btn red" style="margin-top:15px;width:100%" onclick="markUnpaid('+id+')">S&#x27;KA PAGU</button><button class="btn" style="margin-top:10px;width:100%" onclick="document.getElementById(\'pay\').remove()">Kthehu</button></div></div>')}
async function markUnpaid(id){try{await api('/api/porosi/'+id+'/mospagu',{method:'POST'});document.getElementById('pay').remove();toast('Porosia u shënua si e papaguar.');waiter()}catch(e){toast(e.message)}}
async function finish(id,m){try{await api('/api/porosi/'+id+'/pagesa',{method:'POST',body:JSON.stringify({method:m})});document.getElementById('pay').remove();toast('Pagesa u përfundua.');waiter()}catch(e){toast(e.message)}}
async function admin(){var s=await api('/api/statistika');renderAdmin(s)}
function renderAdmin(s){set(head('Administratë')+'<main class="main"><div class="hero"><div><h1>Administrata</h1><p>Porosi, pagesa dhe gjurmë të sistemit.</p></div></div><div class="admin"><aside class="card side"><button class="'+(S.adminTab==='panel'?'active':'')+'" onclick="S.adminTab=\'panel\';admin()">Paneli</button><button class="'+(S.adminTab==='historiku'?'active':'')+'" onclick="S.adminTab=\'historiku\';adminTab()">Pagesat / Borxhet</button><button class="'+(S.adminTab==='gjurmet'?'active':'')+'" onclick="S.adminTab=\'gjurmet\';adminTab()">Gjurmët</button></aside><section id="adminContent"></section></div></main>');adminTab(s)}
async function adminTab(s){var el=document.getElementById('adminContent');if(!el)return;if(S.adminTab==='panel'){s=s||await api('/api/statistika');el.innerHTML='<div class="grid"><div class="card stat"><b>'+s.revenue+'</b><span class="muted">Të hyra sot</span></div><div class="card stat"><b>'+s.paid+'</b><span class="muted">Porosi të paguara</span></div><div class="card stat"><b>'+s.total+'</b><span class="muted">Porosi sot</span></div><div class="card stat"><b>'+s.cancelled+'</b><span class="muted">Të anuluara</span></div></div><div class="section card" style="padding:18px"><h2>Produktet më të shitura</h2><div class="tableWrap"><table class="table"><tr><th>Produkt</th><th>Sasia</th></tr>'+s.top.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+x.quantity+'</td></tr>'}).join('')+'</table></div></div>';return}if(S.adminTab==='historiku'){var rows=await api('/api/historiku');S.historyRows=rows;el.innerHTML='<div class="card" style="padding:18px"><div class="row"><div><h2>Pagesat dhe borxhet</h2><p class="muted">Të gjitha porositë, të paguarat dhe të papaguarat me datë, orë dhe produkte.</p></div><input id="search" style="max-width:320px" placeholder="Kërko porosi, tavolinë, emër..." oninput="searchHistory()"></div><div class="cats" style="margin:15px 0"><button class="btn '+(S.historyFilter==='ALL'?'primary':'')+'" onclick="setHistoryFilter(\'ALL\')">Të gjitha</button><button class="btn '+(S.historyFilter==='UNPAID'?'primary':'')+'" onclick="setHistoryFilter(\'UNPAID\')">Të papaguara</button><button class="btn '+(S.historyFilter==='PAID'?'primary':'')+'" onclick="setHistoryFilter(\'PAID\')">Të paguara</button><button class="btn '+(S.historyFilter==='CANCELLED'?'primary':'')+'" onclick="setHistoryFilter(\'CANCELLED\')">Të anuluara</button></div><div id="hist" class="tableWrap" style="margin-top:14px">'+hist(rows)+'</div></div>';return}var a=await api('/api/audit');el.innerHTML='<div class="card" style="padding:18px"><h2>Gjurmët e sistemit</h2><div class="tableWrap"><table class="table"><tr><th>Ora</th><th>Përdoruesi</th><th>Veprimi</th><th>Objekti</th></tr>'+a.map(function(x){return '<tr><td>'+dt(x.created_at)+'</td><td>'+esc(x.actor_name||'Sistem')+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity_type||'')+' '+(x.entity_id||'')+'</td></tr>'}).join('')+'</table></div></div>'}
function filteredHistory(a){var q=(document.getElementById('search')||{}).value||'';q=q.toLowerCase();return (a||[]).filter(function(x){if(S.historyFilter!=='ALL'&&x.status!==S.historyFilter)return false;if(!q)return true;return String(x.order_number).includes(q)||String(x.table_number||'').includes(q)||(x.custom_identifier||'').toLowerCase().includes(q)})}
function setHistoryFilter(f){S.historyFilter=f;document.getElementById('hist').innerHTML=hist(S.historyRows)}
async function searchHistory(){var q=document.getElementById('search').value;S.historyRows=await api('/api/historiku?'+new URLSearchParams({q:q}));document.getElementById('hist').innerHTML=hist(S.historyRows)}
function hist(a){a=filteredHistory(a);return a.length?'<table class="table"><tr><th>Porosia</th><th>Data / Ora</th><th>Vendndodhja</th><th>Kamarieri</th><th>Totali</th><th>Statusi</th><th>Veprimi</th></tr>'+a.map(function(x){var w=x.table_number?'Tavolina '+x.table_number:(x.custom_identifier||(x.order_type==='ME_VETI'?'Me veti':'Për këtu'));var when=x.status==='UNPAID'?x.unpaid_at:(x.completed_at||x.updated_at);var st=x.status==='PAID'?'Paguar':x.status==='UNPAID'?'Nuk ka paguar':'Anuluar';var act=x.status==='UNPAID'?'<button class="btn ok" onclick="event.stopPropagation();adminPay('+x.id+')">Shëno si paguar</button>':'—';return '<tr onclick="details('+x.id+')" style="cursor:pointer"><td>#'+x.order_number+'</td><td>'+dt(when)+'</td><td>'+esc(w)+'</td><td>'+esc(x.waiter_name)+'</td><td>'+eur(x.total_cents)+'</td><td>'+st+'</td><td>'+act+'</td></tr>'}).join('')+'</table>':'<div class="empty">Nuk u gjet asnjë porosi.</div>'}
function adminPay(id){document.body.insertAdjacentHTML('beforeend','<div class="modalBack" id="adminPay"><div class="modal"><h2>Regjistro pagesën</h2><p class="muted">Porosia e papaguar do të shënohet si e paguar tani.</p><div class="choices"><button class="choice" onclick="finishAdminPay('+id+',\'CASH\')"><strong>Para të gatshme</strong></button><button class="choice" onclick="finishAdminPay('+id+',\'CARD\')"><strong>Kartelë</strong></button><button class="choice" onclick="finishAdminPay('+id+',\'OTHER\')"><strong>Tjetër</strong></button></div><button class="btn" style="margin-top:15px;width:100%" onclick="document.getElementById(\'adminPay\').remove()">Kthehu</button></div></div>')}
async function finishAdminPay(id,m){try{await api('/api/porosi/'+id+'/paguaj',{method:'POST',body:JSON.stringify({method:m})});document.getElementById('adminPay').remove();toast('Pagesa u regjistrua.');S.historyFilter='UNPAID';admin()}catch(e){toast(e.message)}}
async function details(id){var o=await api('/api/historiku/'+id),w=o.table_number?'Tavolina '+o.table_number:(o.custom_identifier||(o.order_type==='ME_VETI'?'Me veti':'Për këtu')),paid=o.payments&&o.payments.length?o.payments[o.payments.length-1]:null;document.body.insertAdjacentHTML('beforeend','<div class="modalBack" id="detail"><div class="modal"><div class="row"><div><h2>Porosia #'+o.order_number+'</h2><p class="muted">'+esc(w)+' · '+esc(o.waiter_name)+'</p></div><button class="btn" onclick="document.getElementById(\'detail\').remove()">Mbyll</button></div><div class="section"><p><b>U hap:</b> '+dt(o.opened_at)+'</p><p><b>Statusi:</b> '+(o.status==='PAID'?'Paguar':o.status==='UNPAID'?'Nuk ka paguar':'Anuluar')+'</p>'+(o.unpaid_at?'<p><b>U shënua pa pagesë:</b> '+dt(o.unpaid_at)+'</p>':'')+(o.completed_at?'<p><b>U pagua / u përfundua:</b> '+dt(o.completed_at)+'</p>':'')+(paid?'<p><b>Mënyra e pagesës:</b> '+esc(paid.method)+'</p>':'')+'</div><h3>Produktet</h3><div>'+o.items.map(function(x){return '<div class="line row"><span>'+x.quantity+' × '+esc(x.product_name_snapshot)+'</span><b>'+eur(x.quantity*x.unit_price_cents)+'</b></div>'}).join('')+'</div><div class="total">'+eur(o.total_cents)+'</div><h3>Ngjarjet / Log</h3>'+o.events.map(function(e){return '<p class="muted">'+dt(e.created_at)+' · '+esc(e.event_type)+' · '+esc(e.actor_name||'Sistem')+'</p>'}).join('')+'</div></div>')}

start().catch(function(e){set('<div class="login"><div class="card loginBox"><h1>Gabim</h1><p class="error">'+esc(e.message)+'</p></div></div>')});
</script>
</body></html>
