<style>
:root{--bg:#0b100e;--p:#141b18;--p2:#1b2420;--line:#2b3631;--text:#f5f7f5;--muted:#9ba8a1;--gold:#d7a23a;--ok:#4caf7d;--red:#df6262;--shadow:0 18px 60px #0008}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1c2923,#0b100e 45%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#0c1110ee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{font-size:20px;font-weight:900;letter-spacing:-.04em}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}.topRight{display:flex;gap:8px;align-items:center}.main{max-width:1500px;margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:22px}.hero h1{font-size:clamp(28px,4vw,44px);margin:0;letter-spacing:-.05em}.hero p{color:var(--muted);margin:7px 0 0}.btn{border:1px solid var(--line);background:var(--p2);color:var(--text);padding:11px 15px;border-radius:12px;font-weight:800}.btn.primary{background:var(--gold);color:#171106;border-color:transparent}.btn.ok{background:var(--ok);color:#07140e;border-color:transparent}.btn.red{background:var(--red);color:white;border-color:transparent}.btn.big{padding:15px 19px;font-size:16px}.pill{border:1px solid var(--line);background:var(--p);padding:9px 12px;border-radius:999px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}.card{background:#141b18e8;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.order{padding:17px;cursor:pointer}.order:hover{border-color:#506057}.tag{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#d7dfda;background:#202a26;padding:5px 8px;border-radius:7px}.order h3{margin:12px 0 3px;font-size:20px}.money{font-size:26px;font-weight:900}.muted{color:var(--muted)}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.section{margin-top:25px}.section h2{font-size:17px}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginBox{width:min(420px,100%);padding:28px}.loginBox h1{font-size:36px;margin:0}.loginBox p{color:var(--muted)}label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}input,select{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#0d1311;color:white;outline:0}input:focus,select:focus{border-color:var(--gold)}.error{color:#ff9c9c;font-size:13px;margin-top:10px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{padding:20px;text-align:left;border:1px solid var(--line);border-radius:15px;background:var(--p2);color:white}.choice strong{display:block;font-size:18px}.choice small{display:block;color:var(--muted);margin-top:5px}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.menu{display:grid;grid-template-columns:1.45fr .85fr;gap:18px;align-items:start}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:7px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px}.product{min-height:105px;padding:12px;text-align:left;border:1px solid var(--line);background:var(--p);color:white;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .16s ease,border-color .16s ease}.product:hover{border-color:#64766b;transform:translateY(-2px)}.product:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.product.has-photo{min-height:0;padding:0;overflow:hidden;justify-content:flex-start}.product-photo{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--p2)}.product-photo.packshot{object-fit:contain;padding:7px}.product-content{width:100%;min-height:76px;padding:11px 12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:8px}.product-content strong{line-height:1.2}.product-price{color:var(--gold);font-weight:900}.product:not(.has-photo) .product-content{min-height:105px;padding:0}@media(prefers-reduced-motion:reduce){.product{transition:none}.product:hover{transform:none}}.summary{padding:18px;position:sticky;top:88px}.line{padding:10px 0;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:30px;height:30px;border-radius:8px;border:0;background:#29342f;color:white}.total{font-size:30px;font-weight:900;padding:15px 0;border-top:1px solid var(--line);margin-top:10px}.modalBack{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#111815;border:1px solid var(--line);border-radius:20px;padding:22px}.admin{display:grid;grid-template-columns:220px 1fr;gap:18px}.side{padding:10px;height:max-content;position:sticky;top:88px}.side button{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:12px;border-radius:10px}.side button.active,.side button:hover{background:var(--p2);color:white}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.table th{color:var(--muted)}.stat{padding:18px}.stat b{font-size:28px;display:block}.toast{position:fixed;right:18px;bottom:18px;background:#eff8f2;color:#111;padding:13px 16px;border-radius:12px;font-weight:800;z-index:100;box-shadow:var(--shadow)}@media(max-width:900px){.menu,.admin{grid-template-columns:1fr}.summary,.side{position:static}.hero{align-items:stretch;flex-direction:column}}@media(max-width:560px){.numbers{grid-template-columns:repeat(4,1fr)}.choices{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}.top{padding:12px 14px}.pill{display:none}.main{padding:15px}}
</style>
<style>
.item-detail{display:flex;flex-direction:column;gap:4px;min-width:0}.item-note{display:inline-block;font-size:11px;font-weight:800;color:#1c1503;background:var(--gold);border-radius:6px;padding:3px 7px;line-height:1.25;word-break:break-word}.note-btn{padding:6px 9px;font-size:11px;border-radius:9px;font-weight:750}.line .note-btn{margin-top:8px;width:100%}.item-time{display:block;color:var(--gold);font-size:11px;font-weight:750;letter-spacing:.01em}.audit-panel{padding:17px 19px}.audit-panel h2{margin:0}.audit-panel>p{margin:5px 0 12px;font-size:13px}.audit-list{max-height:320px;overflow:auto;padding-right:4px}.audit-entry{display:grid;grid-template-columns:minmax(80px,max-content) minmax(0,1fr);gap:13px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--line)}.audit-entry:last-child{border-bottom:0}.audit-time{color:var(--gold);font-size:12px;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}.audit-copy{display:flex;flex-direction:column;gap:3px;min-width:0}.audit-copy b{font-size:13px;line-height:1.4}.audit-copy small{color:var(--muted);font-size:11px}@media(max-width:560px){.audit-panel{padding:15px}.audit-entry{grid-template-columns:68px minmax(0,1fr);gap:9px}.audit-time{font-size:11px}}
</style>

<body><div id="app"><div class="login"><div class="card loginBox"><h1>SHARRI</h1><p>Duke ngarkuar sistemin...</p></div></div></div>
<script>
window.addEventListener("error",function(e){
  var a=document.getElementById("app");
  if(a&&e&&e.message){
    a.innerHTML='<div class="login"><div class="card loginBox"><h1>SHARRI</h1><p class="error">Gabim në frontend. Rifresko faqen dhe kontrollo terminalin.</p></div></div>';
  }
});
window.addEventListener("unhandledrejection",function(){
  var a=document.getElementById("app");
  if(a&&!a.querySelector(".top")) a.innerHTML='<div class="login"><div class="card loginBox"><h1>SHARRI</h1><p class="error">Sistemi nuk u ngarkua. Kontrollo serverin dhe rifresko faqen.</p></div></div>';
});
</script>
<script src="/app.js?v=20261007-1"></script>
