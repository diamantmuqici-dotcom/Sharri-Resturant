name: Kontrolli i Sharri POS
on:
  push:
  pull_request:
jobs:
  kontrollo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: node --check server.js
      - run: node --check db.js
      - name: Kontrollo JavaScript-in e frontendit
        run: node --check public/app.js
      - name: Kontrollo HTML-in
        run: node -e "const fs=require('fs');const h=fs.readFileSync('public/index.html','utf8');if(!h.includes('<script src=\"/app.js'))process.exit(1);console.log('HTML: OK')"
      - name: Kontrollo seed
        run: npm run seed
