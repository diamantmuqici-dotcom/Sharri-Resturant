services:
  - type: web
    name: sharri-pos
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: sharri-data
      mountPath: /app/data
      sizeGB: 1
